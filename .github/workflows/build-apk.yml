name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f config.js ]; then cp config.js www/; fi
          if [ -f logo.jpg ]; then cp logo.jpg www/; fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Elgameia com.elgameia.app --web-dir=www
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elgameia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
