جمعية الخير للجميع — مشروع Android محدث بواجهة الإصدار 7.2

المشروع يضم واجهة الويب الحالية وملف config.js وإعدادات WebView.
تُحمّل الواجهة من أصول التطبيق، لكنها تتصل بخدمات Supabase عبر الإنترنت.
يجب أن يكون مشروع Supabase والجداول والسياسات مُعدّة بالفعل وأن يكون config.js مضبوطًا على المشروع الصحيح.

فتح المشروع:
1) فك ضغط الملف.
2) افتح مجلد android باستخدام Android Studio.
3) انتظر Gradle Sync.
4) من Build اختر Build APK(s).
5) ستجد ملف APK داخل android/app/build/outputs/apk/debug/ بعد نجاح البناء.

مهم:
- هذا ملف مشروع Android وليس APK جاهزًا.
- بيئة إعداد هذا الملف لا تحتوي على Android SDK/Gradle لبناء APK والتحقق منه هنا.
- بيانات السجلات تُحمّل من قاعدة Supabase app_state إذا كانت القاعدة مُعدة وتحتوي البيانات.
- لا تدخل بيانات حقيقية قبل مراجعة سياسات الأمان وصلاحيات الوصول؛ مخطط SQL المرفق تجريبي وسياساته واسعة.
- النسخ الاحتياطي/الاستعادة داخل الواجهة يعتمد على وظائف الويب الموجودة؛ اختبر التصدير والاستيراد على نسخة تجريبية قبل الاستخدام الفعلي.
